<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Advanced Meme Foundry Media Studio - Create, edit, and export professional memes and multimedia content">
  <meta name="keywords" content="meme editor, video compositor, media studio, meme maker, video editor">
  
  <!-- Open Graph / Social -->
  <meta property="og:title" content="Meme Foundry Media Studio">
  <meta property="og:description" content="Professional browser-based meme and media composition studio">
  <meta property="og:image" content="/social-preview.png">
  <meta property="og:url" content="https://memefoundry.app">
  <meta property="og:type" content="website">
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Meme Foundry Media Studio">
  <meta name="twitter:description" content="Professional browser-based meme and media composition studio">
  <meta name="twitter:image" content="/social-preview.png">
  
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  
  <!-- Preload critical assets -->
  <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  
  <!-- Security -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval' 'inline-speculation-rules';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https:;
    media-src 'self' blob:;
    font-src 'self' https://fonts.gstatic.com;
    connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;
    worker-src 'self' blob:;
  ">
  
  <title>Meme Foundry - Advanced Media Studio</title>
  
  <style>
    /* Critical CSS for initial render */
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-tertiary: #0f3460;
      --text-primary: #e8e8e8;
      --text-secondary: #a0a0b0;
      --accent-primary: #e94560;
      --accent-secondary: #533483;
      --border-color: #2a2a4a;
      --safe-area-inset-top: env(safe-area-inset-top, 0px);
      --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }
    
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.3s ease-in;
    }
    
    #app.loaded {
      opacity: 1;
    }
    
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    
    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .loader {
      width: 48px;
      height: 48px;
      border: 4px solid var(--text-secondary);
      border-bottom-color: var(--accent-primary);
      border-radius: 50%;
      animation: rotation 1s linear infinite;
    }
    
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-text {
      margin-top: 20px;
      color: var(--text-secondary);
      font-size: 14px;
    }
    
    /* Accessibility */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
    
    @media (prefers-reduced-motion: reduce) {
      .loader {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="loading-screen" role="status" aria-live="polite">
    <div class="loader" aria-hidden="true"></div>
    <p class="loading-text">Loading Meme Foundry...</p>
    <p class="sr-only">Application is loading, please wait</p>
  </div>
  
  <div id="app" role="application" aria-label="Meme Foundry Media Studio">
    <!-- App shell will be rendered here by bootstrap.js -->
    <noscript>
      <div style="padding: 20px; text-align: center;">
        <h1>JavaScript Required</h1>
        <p>Meme Foundry requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
  </div>
  
  <script type="module" src="/src/app/bootstrap.js"></script>
  
  <script>
    // Basic feature detection
    (function() {
      const missingFeatures = [];
      
      if (!window.CanvasRenderingContext2D) missingFeatures.push('Canvas');
      if (!window.OffscreenCanvas) console.warn('OffscreenCanvas not available - performance may be degraded');
      if (!window.indexedDB) missingFeatures.push('IndexedDB');
      if (typeof Worker === 'undefined') missingFeatures.push('Web Workers');
      
      if (missingFeatures.length > 0) {
        document.getElementById('loading-screen').innerHTML = `
          <div style="text-align: center; padding: 20px;">
            <h2 style="color: #e94560; margin-bottom: 10px;">Browser Not Supported</h2>
            <p>Your browser is missing required features:</p>
            <ul style="list-style: none; margin: 10px 0;">
              ${missingFeatures.map(f => `<li>❌ ${f}</li>`).join('')}
            </ul>
            <p>Please use a modern browser like Chrome, Firefox, or Edge.</p>
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
